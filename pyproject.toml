[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crn"
version = "0.1.0"
description = "DNA, RNA ve protein dizileriyle çalışmak için araçlar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tqdm>=4.66", "requests>=2.31", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["crn*"]
